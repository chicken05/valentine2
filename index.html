</head>
<body>
    <div class="container" id="page1">
        <h1>I have something to ask you...</h1>
        <button onclick="nextPage()">Click Me!</button>

        <img src="https://media.giphy.com/media/3o7abAHdYvZdBNnGZq/giphy.gif" alt="Happy GIF">

        <img src="https://media.giphy.com/media/VX7yE2ZZItYda/giphy.gif" alt="Crying Cat GIF">

    <script src="script.js"></script>
